<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="container mt-5" style="max-width: 400px;">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" id="userInput" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="passInput" class="form-control" required>
                </div>
                <button onclick="login()" class="tag-btn btn btn-primary w-100">Ingresar</button>
                <div id="loginError" class="text-danger mt-3 text-center"></div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN DE PANEL DE INVENTARIO -->
    <div id="app-section" class="container mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Panel de Control de Inventario</h2>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
        </div>

        <!-- Formulario para agregar / editar -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 id="formTitle" class="card-title">Agregar Nuevo Elemento</h5>
                <form id="itemForm" class="row g-3" onsubmit="saveItem(event)">
                    <input type="hidden" id="rowIndex">
                    <!-- Ajusta estos campos según las columnas de tu pestaña inventario -->
                    <div class="col-md-4">
                        <label class="form-label">Código / ID</label>
                        <input type="text" id="col0" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Descripción</label>
                        <input type="text" id="col1" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Cantidad</label>
                        <input type="number" id="col2" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success" id="btnGuardar">Guardar Registro</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()" style="display:none;" id="btnCancelar">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de datos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="inventarioTable">
                        <thead>
                            <!-- Se llenará dinámicamente -->
                        </thead>
                        <tbody>
                            <!-- Se llenará dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwFad6Vv6RwDBHmKqTEEZfdhdF5lnbl8PXo2It02lI3SR7vvKvOiWx1iO-hsdsETw0/exec';
        let inventarioData = [];

        function login() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;

            fetch(`${API_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`)
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        document.getElementById('login-section').style.display = 'none';
                        document.getElementById('app-section').style.display = 'block';
                        cargarInventario();
                    } else {
                        document.getElementById('loginError').innerText = res.message;
                    }
                }).catch(err => alert('Error de conexión'));
        }

        function logout() {
            document.getElementById('app-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
        }

        function cargarInventario() {
            fetch(`${API_URL}?action=read`)
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        inventarioData = res.data;
                        renderTable();
                    }
                });
        }

        function renderTable() {
            const thead = document.querySelector('#inventarioTable thead');
            const tbody = document.querySelector('#inventarioTable tbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (inventarioData.length === 0) return;

            // Cabecera (Fila 0 de la hoja)
            let headerRow = '<tr>';
            inventarioData[0].forEach(col => {
                headerRow += `<th>${col}</th>`;
            });
            headerRow += '<th>Acciones</th></tr>';
            thead.innerHTML = headerRow;

            // Cuerpo (Filas siguientes)
            for (let i = 1; i < inventarioData.length; i++) {
                let row = inventarioData[i];
                let tr = '<tr>';
                row.forEach(cell => {
                    tr += `<td>${cell}</td>`;
                });
                tr += `<td>
                        <button class="btn btn-sm btn-warning me-1" onclick="editarFila(${i})">Editar</button>
                        <button class="btn btn-sm btn-danger" onclick="eliminarFila(${i + 1})">Eliminar</button>
                       </td>`;
                tr += '</tr>';
                tbody.innerHTML += tr;
            }
        }

        function saveItem(e) {
            e.preventDefault();
            const rowIndex = document.getElementById('rowIndex').value;
            // Ajusta la cantidad de campos según tus columnas
            const rowData = [
                document.getElementById('col0').value,
                document.getElementById('col1').value,
                document.getElementById('col2').value
            ];

            const action = rowIndex ? 'update' : 'add';
            // El índice real en Google Sheets (base 1) requiere compensar cabecera y arreglos
            const realRowIndex = rowIndex ? parseInt(rowIndex) + 1 : null;

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: action, row: rowData, rowIndex: realRowIndex })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    resetForm();
                    cargarInventario();
                }
            });
        }

        function editarFila(index) {
            const row = inventarioData[index];
            document.getElementById('rowIndex').value = index;
            document.getElementById('col0').value = row[0];
            document.getElementById('col1').value = row[1];
            document.getElementById('col2').value = row[2];
            document.getElementById('formTitle').innerText = 'Editar Elemento';
            document.getElementById('btnGuardar').innerText = 'Actualizar';
            document.getElementById('btnCancelar').style.display = 'inline-block';
        }

        function eliminarFila(sheetRowIndex) {
            if (confirm('¿Estás seguro de eliminar este registro?')) {
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', rowIndex: sheetRowIndex })
                })
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        cargarInventario();
                    }
                });
            }
        }

        function resetForm() {
            document.getElementById('itemForm').reset();
            document.getElementById('rowIndex').value = '';
            document.getElementById('formTitle').innerText = 'Agregar Nuevo Elemento';
            document.getElementById('btnGuardar').innerText = 'Guardar Registro';
            document.getElementById('btnCancelar').style.display = 'none';
        }
    </script>
</body>
</html>
