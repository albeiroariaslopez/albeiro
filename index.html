<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- LOGIN SCREEN -->
    <div id="loginSection" class="container mt-5" style="max-width: 400px;">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="fas fa-boxes"></i> Inventario</h3>
                <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" id="userInput" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="passInput" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="loginBtn">Ingresar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="appSection" class="container-fluid mt-4 d-none">
        <div class="row mb-3">
            <div class="col-md-6">
                <h2><i class="fas fa-warehouse"></i> Gestión de Inventario</h2>
                <span class="text-muted" id="userWelcome"></span>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#itemModal" onclick="prepareAdd()">
                    <i class="fas fa-plus"></i> Nuevo Artículo
                </button>
                <button class="btn btn-outline-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="Consultar por código, producto, categoría o proveedor..." onkeyup="filterTable()">
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Código</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Stock</th>
                                <th>Precio ($)</th>
                                <th>Proveedor</th>
                                <th>Actualizado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <!-- Datos cargados dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ADD/EDIT -->
    <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nuevo Artículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="itemForm">
                        <input type="hidden" id="itemId">
                        <div class="mb-3">
                            <label class="form-label">Código</label>
                            <input type="text" id="itemCodigo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Producto</label>
                            <input type="text" id="itemProducto" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <input type="text" id="itemCategoria" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" id="itemStock" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio</label>
                            <input type="number" id="itemPrecio" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Proveedor</label>
                            <input type="text" id="itemProveedor" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="saveBtn">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/library/d/17dqeNT1QDo1HijbGC_8OREifaVJLEEcLOwCsK0miivyrx9vJu74rDA2U/2"; // Reemplaza con tu URL de Google Apps Script
        let inventoryData = [];
        let modalInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            modalInstance = new bootstrap.Modal(document.getElementById('itemModal'));
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            const alertBox = document.getElementById('loginAlert');
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = 'Verificando...';
            alertBox.classList.add('d-none');

            try {
                const response = await fetch(`${API_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
                const result = await response.json();

                if (result.status === 'success') {
                    document.getElementById('loginSection').classList.add('d-none');
                    document.getElementById('appSection').classList.remove('d-none');
                    document.getElementById('userWelcome').innerText = `Usuario: ${result.usuario} (${result.rol})`;
                    loadInventory();
                } else {
                    alertBox.innerText = result.message;
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.innerText = "Error de conexión con el servidor.";
                alertBox.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Ingresar';
            }
        });

        async function loadInventory() {
            try {
                const response = await fetch(`${API_URL}?action=getInventario`);
                const result = await response.json();
                if (result.status === 'success') {
                    inventoryData = result.data;
                    renderTable(inventoryData);
                }
            } catch (err) {
                alert("No se pudo cargar el inventario.");
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.codigo}</td>
                        <td>${item.producto}</td>
                        <td>${item.categoria}</td>
                        <td>${item.stock}</td>
                        <td>$ ${Number(item.precio).toLocaleString()}</td>
                        <td>${item.proveedor}</td>
                        <td>${item.actualizado}</td>
                        <td>
                            <button class="btn btn-sm btn-warning me-1" onclick='prepareEdit(${JSON.stringify(item)})'><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger" onclick='deleteItem(${item.id})'><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = inventoryData.filter(item => 
                String(item.codigo).toLowerCase().includes(query) ||
                String(item.producto).toLowerCase().includes(query) ||
                String(item.categoria).toLowerCase().includes(query) ||
                String(item.proveedor).toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        function prepareAdd() {
            document.getElementById('modalTitle').innerText = "Nuevo Artículo";
            document.getElementById('itemId').value = "";
            document.getElementById('itemForm').reset();
        }

        function prepareEdit(item) {
            document.getElementById('modalTitle').innerText = "Editar Artículo";
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemCodigo').value = item.codigo;
            document.getElementById('itemProducto').value = item.producto;
            document.getElementById('itemCategoria').value = item.categoria;
            document.getElementById('itemStock').value = item.stock;
            document.getElementById('itemPrecio').value = item.precio;
            document.getElementById('itemProveedor').value = item.proveedor;
            modalInstance.show();
        }

        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const item = {
                id: id,
                codigo: document.getElementById('itemCodigo').value,
                producto: document.getElementById('itemProducto').value,
                categoria: document.getElementById('itemCategoria').value,
                stock: document.getElementById('itemStock').value,
                precio: document.getElementById('itemPrecio').value,
                proveedor: document.getElementById('itemProveedor').value
            };

            const action = id ? 'update' : 'add';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: action, item: item })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    modalInstance.hide();
                    loadInventory();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Error al guardar el registro.");
            }
        });

        async function deleteItem(id) {
            if (!confirm("¿Estás seguro de eliminar este registro?")) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', id: id })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    loadInventory();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Error al eliminar el registro.");
            }
        }

        function logout() {
            document.getElementById('appSection').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
            document.getElementById('loginForm').reset();
        }
    </script>
</body>
</html>
