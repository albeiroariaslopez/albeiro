<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 10px; border: none; }
        .table-responsive { background: #fff; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="mb-4 text-primary text-center">Gestión de Registros (Prueba)</h2>

    <!-- Formulario para Agregar/Editar -->
    <div class="card shadow-sm p-4 mb-5">
        <h5 class="card-title mb-3" id="formTitle">Agregar Nuevo Registro</h5>
        <form id="dataForm">
            <input type="hidden" id="idInput" name="ID">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="claveInput" class="form-label">CLAVE <span class="text-danger">* (Única)</span></label>
                    <input type="text" class="form-control" id="claveInput" required>
                </div>
                <div class="col-md-4">
                    <label for="articuloInput" class="form-label">ARTICULO</label>
                    <input type="text" class="form-control" id="articuloInput" required>
                </div>
                <div class="col-md-4">
                    <label for="cantidadInput" class="form-label">CANTIDAD</label>
                    <input type="number" class="form-control" id="cantidadInput" required>
                </div>
                <div class="col-md-4">
                    <label for="estadoInput" class="form-label">ESTADO</label>
                    <select class="form-select" id="estadoInput" required>
                        <option value="Bueno">Bueno</option>
                        <option value="Regular">Regular</option>
                        <option value="Malo">Malo</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="valorInput" class="form-label">VALOR</label>
                    <input type="number" step="0.01" class="form-control" id="valorInput" required>
                </div>
            </div>

            <div class="mt-4 text-end">
                <button type="button" class="btn btn-secondary me-2 d-none" id="btnCancel" onclick="resetForm()">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="btnSave">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="saveSpinner" role="status"></span>
                    <span id="btnSaveText">Agregar Registro</span>
                </button>
            </div>
        </form>
    </div>

    <!-- Tabla de Registros y Búsqueda -->
    <div class="table-responsive shadow-sm p-3">
        <div class="row align-items-center mb-3 g-2">
            <div class="col-md-6 col-12">
                <h5 class="m-0">Registros Actuales</h5>
            </div>
            <div class="col-md-6 col-12 d-flex justify-content-end align-items-center gap-2">
                <!-- Campo y botón de búsqueda -->
                <div class="input-group input-group-sm">
                    <input type="text" class="form-control" id="searchInput" placeholder="Buscar por Clave, Artículo..." onkeyup="if(event.key === 'Enter') filterData()">
                    <button class="btn btn-primary" type="button" onclick="filterData()">🔍 Buscar</button>
                    <button class="btn btn-outline-secondary" type="button" onclick="clearSearch()">Limpiar</button>
                </div>
                <button class="btn btn-outline-primary btn-sm flex-shrink-0" onclick="loadData()">🔄 Refrescar</button>
            </div>
        </div>

        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>CLAVE</th>
                    <th>ARTÍCULO</th>
                    <th>CANTIDAD</th>
                    <th>ESTADO</th>
                    <th>VALOR</th>
                    <th class="text-center">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="7" class="text-center py-4">Cargando datos desde Google Sheets...</td>
                </tr>
            </tbody>
        </table>

        <!-- Paginación -->
        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
            <div class="small text-muted" id="paginationInfo">Mostrando 0 - 0 de 0 registros</div>
            <nav>
                <ul class="pagination pagination-sm m-0" id="paginationControls"></ul>
            </nav>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgJJW8mwNjciSBEiWTDLskgw1-ByPfPj12_AVE-q9OBSc73Nr89hCk1nLsjwa_MOA/exec";

    let recordsData = [];
    let filteredData = [];
    let isEditing = false;

    // Configuración de paginación
    const ITEMS_PER_PAGE = 10;
    let currentPage = 1;

    document.addEventListener("DOMContentLoaded", () => {
        loadData();
    });

    // Obtener datos desde Google Sheets
    async function loadData() {
        try {
            const response = await fetch(SCRIPT_URL);
            recordsData = await response.json();
            filteredData = [...recordsData];
            currentPage = 1;
            renderCurrentPage();
        } catch (error) {
            console.error("Error al cargar los datos:", error);
            document.getElementById('tableBody').innerHTML = `
                <tr><td colspan="7" class="text-center text-danger">Error al cargar datos desde la hoja de cálculo.</td></tr>
            `;
        }
    }

    // Filtrar/Buscar registros
    function filterData() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) {
            filteredData = [...recordsData];
        } else {
            filteredData = recordsData.filter(row => {
                return (
                    String(row.ID || '').toLowerCase().includes(query) ||
                    String(row.CLAVE || '').toLowerCase().includes(query) ||
                    String(row.ARTICULO || '').toLowerCase().includes(query) ||
                    String(row.ESTADO || '').toLowerCase().includes(query)
                );
            });
        }
        currentPage = 1;
        renderCurrentPage();
    }

    // Limpiar campo de búsqueda
    function clearSearch() {
        document.getElementById('searchInput').value = '';
        filteredData = [...recordsData];
        currentPage = 1;
        renderCurrentPage();
    }

    // Renderizar la página actual de la tabla
    function renderCurrentPage() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (!filteredData || filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center">No se encontraron registros.</td></tr>`;
            document.getElementById('paginationInfo').innerText = 'Mostrando 0 de 0 registros';
            document.getElementById('paginationControls').innerHTML = '';
            return;
        }

        const totalItems = filteredData.length;
        const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
        const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalItems);
        const pageData = filteredData.slice(startIndex, endIndex);

        pageData.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.ID || ''}</td>
                <td><strong>${row.CLAVE || ''}</strong></td>
                <td>${row.ARTICULO || ''}</td>
                <td>${row.CANTIDAD || 0}</td>
                <td><span class="badge ${row.ESTADO === 'Bueno' ? 'bg-success' : (row.ESTADO === 'Regular' ? 'bg-warning text-dark' : 'bg-danger')}">${row.ESTADO || ''}</span></td>
                <td>$${Number(row.VALOR || 0).toLocaleString()}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-warning" onclick="editRecord('${row.CLAVE}')">Editar</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Actualizar contador
        document.getElementById('paginationInfo').innerText = `Mostrando ${startIndex + 1} - ${endIndex} de ${totalItems} registros`;

        // Renderizar controles de paginación
        renderPagination(totalPages);
    }

    // Construir botones de paginación
    function renderPagination(totalPages) {
        const navUl = document.getElementById('paginationControls');
        navUl.innerHTML = '';

        if (totalPages <= 1) return;

        // Botón Anterior
        const prevLi = document.createElement('li');
        prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
        prevLi.innerHTML = `<a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">Anterior</a>`;
        navUl.appendChild(prevLi);

        // Páginas numeradas
        for (let i = 1; i <= totalPages; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>`;
            navUl.appendChild(li);
        }

        // Botón Siguiente
        const nextLi = document.createElement('li');
        nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
        nextLi.innerHTML = `<a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">Siguiente</a>`;
        navUl.appendChild(nextLi);
    }

    function changePage(page) {
        currentPage = page;
        renderCurrentPage();
    }

    // Guardar nuevo registro o actualización
    document.getElementById('dataForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const claveVal = document.getElementById('claveInput').value.trim();
        
        if (!isEditing) {
            const exists = recordsData.some(r => String(r.CLAVE).toLowerCase() === claveVal.toLowerCase());
            if (exists) {
                alert('La CLAVE ingresada ya existe. Debe ser un valor único.');
                return;
            }
        }

        const payload = {
            action: isEditing ? 'edit' : 'add',
            record: {
                ID: document.getElementById('idInput').value,
                CLAVE: claveVal,
                ARTICULO: document.getElementById('articuloInput').value.trim(),
                CANTIDAD: parseInt(document.getElementById('cantidadInput').value),
                ESTADO: document.getElementById('estadoInput').value,
                VALOR: parseFloat(document.getElementById('valorInput').value)
            }
        };

        setLoading(true);

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            });

            const res = await response.json();

            if (res.status === 'success') {
                alert(res.message);
                resetForm();
                await loadData();
            } else {
                alert('Error: ' + res.message);
            }
        } catch (err) {
            console.error('Error al guardar datos:', err);
            alert('Ocurrió un error al guardar los datos.');
        } finally {
            setLoading(false);
        }
    });

    // Preparar formulario para edición
    function editRecord(clave) {
        const record = recordsData.find(r => String(r.CLAVE) === String(clave));
        if (!record) return;

        isEditing = true;
        document.getElementById('formTitle').innerText = "Guardar Modificaciones del Registro";
        document.getElementById('btnSaveText').innerText = "Guardar Cambios";
        document.getElementById('btnCancel').classList.remove('d-none');
        
        document.getElementById('idInput').value = record.ID || '';
        document.getElementById('claveInput').value = record.CLAVE || '';
        document.getElementById('claveInput').readOnly = true;
        document.getElementById('articuloInput').value = record.ARTICULO || '';
        document.getElementById('cantidadInput').value = record.CANTIDAD || '';
        document.getElementById('estadoInput').value = record.ESTADO || 'Bueno';
        document.getElementById('valorInput').value = record.VALOR || '';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Resetear formulario
    function resetForm() {
        isEditing = false;
        document.getElementById('dataForm').reset();
        document.getElementById('formTitle').innerText = "Agregar Nuevo Registro";
        document.getElementById('btnSaveText').innerText = "Agregar Registro";
        document.getElementById('btnCancel').classList.add('d-none');
        document.getElementById('claveInput').readOnly = false;
        document.getElementById('idInput').value = '';
    }

    function setLoading(loading) {
        const spinner = document.getElementById('saveSpinner');
        const btn = document.getElementById('btnSave');
        if (loading) {
            spinner.classList.remove('d-none');
            btn.disabled = true;
        } else {
            spinner.classList.add('d-none');
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
