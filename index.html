<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Inventario</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Pantalla de Login -->
    <div id="loginSection" class="container mt-5" style="max-width: 400px;">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-shield-lock"></i> Acceso al Sistema</h3>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label">Contraseña de Acceso</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="Ingrese su clave">
                </div>
                <button onclick="verificarAcceso()" class="btn btn-primary w-100">Ingresar</button>
                <div id="loginError" class="text-danger mt-3 text-center" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Panel de Inventario (Oculto hasta iniciar sesión) -->
    <div id="appSection" class="container py-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-boxes"></i> Gestión de Inventario</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevo"><i class="bi bi-plus-circle"></i> Nuevo Producto</button>
        </div>

        <!-- Buscador -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar por código, producto o categoría..." onkeyup="filtrarTabla()">
            </div>
        </div>

        <!-- Tabla de Datos -->
        <div class="card shadow-sm">
            <div class="card-body table-responsive">
                <table class="table table-hover align-middle" id="inventoryTable">
                    <thead class="table-dark">
                        <tr>
                            ID, Código, Producto, Categoría, Stock, Precio ($), Proveedor, Actualizado
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Datos cargados dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Producto -->
    <div class="modal fade" id="modalNuevo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar Nuevo Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <div class="mb-3">
                            <label class="form-label">Código</label>
                            <input type="text" class="form-control" id="codigo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre del Producto</label>
                            <input type="text" class="form-control" id="producto" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <input type="text" class="form-control" id="categoria" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock Inicial</label>
                            <input type="number" class="form-control" id="stock" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio</label>
                            <input type="number" step="0.01" class="form-control" id="precio" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Proveedor</label>
                            <input type="text" class="form-control" id="proveedor" required>
                        </div>
                        <button type="button" onclick="guardarProducto()" class="btn btn-primary w-100">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // CONFIGURACIÓN: Reemplaza esta URL con la URL de tu Web App de Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxscg9-8rvQcDRusvVoeL_-eLTvyzSSVVsOXejPYtdmzwt8UBxzD4F-3VcrigPdqA/exec";
        let globalPassword = "";
        let inventoryData = [];

        async function verificarAcceso() {
            const pass = document.getElementById("passwordInput").value;
            globalPassword = pass;
            
            // Intentar cargar datos para validar contraseña
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getData`);
                const result = await response.json();
                
                if (result.status === "success") {
                    // Validamos haciendo un POST rápido o validando contra el backend
                    inventoryData = result.data;
                    renderTable(inventoryData);
                    document.getElementById("loginSection").style.display = "none";
                    document.getElementById("appSection").style.display = "block";
                } else {
                    mostrarError("Error al conectar con la base de datos.");
                }
            } catch (error) {
                mostrarError("Credenciales incorrectas o error de conexión.");
            }
        }

        function mostrarError(msg) {
            const errDiv = document.getElementById("loginError");
            errDiv.innerText = msg;
            errDiv.style.display = "block";
        }

        async function cargarInventario() {
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getData`);
                const result = await response.json();
                if (result.status === "success") {
                    inventoryData = result.data;
                    renderTable(inventoryData);
                }
            } catch (e) {
                console.error("Error cargando datos", e);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id || ''}</td>
                        <td><strong>${item.codigo || ''}</strong></td>
                        <td>${item.producto || ''}</td>
                        <td><span class="badge bg-secondary">${item.categoria || ''}</span></td>
                        <td>${item.stock || 0}</td>
                        <td>$ ${Number(item.precio || 0).toLocaleString()}</td>
                        <td>${item.proveedor || ''}</td>
                        <td>${item.actualizado || ''}</td>
                    </tr>
                `;
            });
        }

        function filtrarTabla() {
            const term = document.getElementById("searchInput").value.toLowerCase();
            const filtered = inventoryData.filter(item => 
                String(item.codigo).toLowerCase().includes(term) ||
                String(item.producto).toLowerCase().includes(term) ||
                String(item.categoria).toLowerCase().includes(term)
            );
            renderTable(filtered);
        }

        async function guardarProducto() {
            const nuevo = {
                action: "add",
                password: globalPassword,
                codigo: document.getElementById("codigo").value,
                producto: document.getElementById("producto").value,
                categoria: document.getElementById("categoria").value,
                stock: document.getElementById("stock").value,
                precio: document.getElementById("precio").value,
                proveedor: document.getElementById("proveedor").value
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(nuevo)
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("¡Producto registrado con éxito!");
                    location.reload();
                } else {
                    alert("Error: " + result.message);
                }
            } catch (e) {
                alert("Error de red al registrar el producto.");
            }
        }
    </script>
</body>
</html>
