<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Pantalla de Login -->
    <div id="loginSection" class="container mt-5" style="max-width: 420px;">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-shield-lock text-primary"></i> Control de Acceso</h3>
                <form onsubmit="iniciarSesion(event)">
                    <div class="mb-3">
                        <label for="userInput" class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="userInput" placeholder="Ej. admin" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="passwordInput" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" id="btnLogin" class="btn btn-primary w-100">Ingresar al Sistema</button>
                </form>
                <div id="loginError" class="alert alert-danger mt-3 py-2 text-center" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Panel de Inventario -->
    <div id="appSection" class="container py-4" style="display: none;">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <div>
                <h2 class="mb-0"><i class="bi bi-boxes text-primary"></i> Gestión de Inventario</h2>
                <small class="text-muted">Sesión iniciada como: <strong id="lblUsuario"></strong> (<span id="lblRol"></span>)</small>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevo">
                    <i class="bi bi-plus-circle"></i> Nuevo Producto
                </button>
                <button class="btn btn-outline-danger" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>

        <!-- Buscador -->
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar por código, producto, categoría o proveedor..." onkeyup="filtrarTabla()">
            </div>
        </div>

        <!-- Tabla de Datos -->
        <div class="card shadow-sm border-0">
            <div class="card-body table-responsive">
                <table class="table table-hover align-middle" id="inventoryTable">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Precio ($)</th>
                            <th>Proveedor</th>
                            <th>Actualizado</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Producto -->
    <div class="modal fade" id="modalNuevo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar Nuevo Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm" onsubmit="guardarProducto(event)">
                        <div class="mb-3">
                            <label class="form-label">Código</label>
                            <input type="text" class="form-control" id="codigo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre del Producto</label>
                            <input type="text" class="form-control" id="producto" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <input type="text" class="form-control" id="categoria" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock Inicial</label>
                            <input type="number" class="form-control" id="stock" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio</label>
                            <input type="number" step="0.01" class="form-control" id="precio" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Proveedor</label>
                            <input type="text" class="form-control" id="proveedor" required>
                        </div>
                        <button type="submit" id="btnGuardar" class="btn btn-primary w-100">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // REEMPLAZA CON LA NUEVA URL DE TU IMPLEMENTACIÓN DE APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxscg9-8rvQcDRusvVoeL_-eLTvyzSSVVsOXejPYtdmzwt8UBxzD4F-3VcrigPdqA/exec";
        
        let sessionCreds = { usuario: "", password: "" };
        let inventoryData = [];

        async function iniciarSesion(e) {
            e.preventDefault();
            const usuario = document.getElementById("userInput").value;
            const password = document.getElementById("passwordInput").value;
            const btn = document.getElementById("btnLogin");
            const errDiv = document.getElementById("loginError");

            btn.disabled = true;
            btn.innerText = "Verificando...";
            errDiv.style.display = "none";

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "login",
                        usuario: usuario,
                        password: password
                    })
                });
                const result = await response.json();

                if (result.status === "success") {
                    sessionCreds = { usuario, password };
                    inventoryData = result.data;
                    
                    document.getElementById("lblUsuario").innerText = result.usuario;
                    document.getElementById("lblRol").innerText = result.rol;
                    
                    renderTable(inventoryData);
                    document.getElementById("loginSection").style.display = "none";
                    document.getElementById("appSection").style.display = "block";
                } else {
                    errDiv.innerText = result.message;
                    errDiv.style.display = "block";
                }
            } catch (error) {
                errDiv.innerText = "Error de conexión con el servidor de Google Apps Script.";
                errDiv.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerText = "Ingresar al Sistema";
            }
        }

        function cerrarSesion() {
            sessionCreds = { usuario: "", password: "" };
            inventoryData = [];
            document.getElementById("userInput").value = "";
            document.getElementById("passwordInput").value = "";
            document.getElementById("appSection").style.display = "none";
            document.getElementById("loginSection").style.display = "block";
        }

        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id || ''}</td>
                        <td><strong>${item.codigo || ''}</strong></td>
                        <td>${item.producto || ''}</td>
                        <td><span class="badge bg-secondary">${item.categoria || ''}</span></td>
                        <td>${item.stock || 0}</td>
                        <td>$ ${Number(item.precio || 0).toLocaleString()}</td>
                        <td>${item.proveedor || ''}</td>
                        <td>${item.actualizado || ''}</td>
                    </tr>
                `;
            });
        }

        function filtrarTabla() {
            const term = document.getElementById("searchInput").value.toLowerCase();
            const filtered = inventoryData.filter(item => 
                String(item.codigo).toLowerCase().includes(term) ||
                String(item.producto).toLowerCase().includes(term) ||
                String(item.categoria).toLowerCase().includes(term) ||
                String(item.proveedor).toLowerCase().includes(term)
            );
            renderTable(filtered);
        }

        async function guardarProducto(e) {
            e.preventDefault();
            const btn = document.getElementById("btnGuardar");
            btn.disabled = true;
            btn.innerText = "Guardando...";

            const payload = {
                action: "add",
                usuario: sessionCreds.usuario,
                password: sessionCreds.password,
                codigo: document.getElementById("codigo").value,
                producto: document.getElementById("producto").value,
                categoria: document.getElementById("categoria").value,
                stock: document.getElementById("stock").value,
                precio: document.getElementById("precio").value,
                proveedor: document.getElementById("proveedor").value
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    inventoryData = result.data;
                    renderTable(inventoryData);
                    document.getElementById("productForm").reset();
                    bootstrap.Modal.getInstance(document.getElementById('modalNuevo')).hide();
                } else {
                    alert("Error: " + result.message);
                }
            } catch (error) {
                alert("Error de red al guardar el producto.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Guardar Producto";
            }
        }
    </script>
</body>
</html>
