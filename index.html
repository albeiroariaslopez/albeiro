<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario - Caldas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="container mt-5" style="max-width: 400px;">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" id="userInput" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="passInput" class="form-control" required>
                </div>
                <button onclick="login()" class="btn btn-primary w-100">Ingresar</button>
                <div id="loginError" class="text-danger mt-3 text-center"></div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN DE PANEL DE INVENTARIO -->
    <div id="app-section" class="container mt-4 mb-5" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>Panel de Control</h2>
                <span id="userRoleBadge" class="badge bg-secondary"></span>
            </div>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
        </div>

        <!-- Formulario Dinámico -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 id="formTitle" class="card-title mb-3">Agregar Nuevo Registro</h5>
                <form id="itemForm" onsubmit="saveItem(event)">
                    <input type="hidden" id="rowIndex">
                    <div id="formFieldsContainer" class="row g-3"></div>
                    
                    <div class="mt-3">
                        <button type="submit" class="btn btn-success" id="btnGuardar">Guardar Registro</button>
                        <button type="button" class="btn btn-secondary ms-2" onclick="resetForm()" style="display:none;" id="btnCancelar">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de Datos, Buscador, Paginación y Exportación -->
        <div class="card shadow-sm">
            <div class="card-body">
                <!-- Filtros, Selector de Registros y Botón de Excel -->
                <div class="row mb-3 align-items-center">
                    <div class="col-md-5 mb-2 mb-md-0">
                        <div class="input-group">
                            <span class="input-group-text bg-white">🔍</span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Buscar en el inventario..." onkeyup="cambiarFiltro()">
                            <button class="btn btn-outline-secondary" type="button" onclick="limpiarBusqueda()">Limpiar</button>
                        </div>
                    </div>
                    <div class="col-md-7 d-flex justify-content-md-end align-items-center gap-2 flex-wrap">
                        <button onclick="exportarAExcel()" class="btn btn-outline-success btn-sm">📊 Exportar a Excel</button>
                        <label class="text-muted small text-nowrap ms-2">Mostrar:</label>
                        <select id="itemsPerPage" class="form-select form-select-sm" style="width: 80px;" onchange="cambiarRegistrosPorPagina()">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="inventarioTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <!-- Controles de Paginación -->
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <span id="contadorRegistros" class="text-muted small"></span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0" id="paginationContainer"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwFad6Vv6RwDBHmKqTEEZfdhdF5lnbl8PXo2It02lI3SR7vvKvOiWx1iO-hsdsETw0/exec';
        let inventarioData = [];
        let currentUserRole = '';
        let paginaActual = 1;
        let registrosPorPagina = 25;
        let filasFiltradasIndices = [];

        function login() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;

            fetch(`${API_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`)
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        currentUserRole = res.role;
                        document.getElementById('userRoleBadge').innerText = `Rol: ${currentUserRole}`;
                        document.getElementById('login-section').style.display = 'none';
                        document.getElementById('app-section').style.display = 'block';
                        cargarInventario();
                    } else {
                        document.getElementById('loginError').innerText = res.message;
                    }
                }).catch(err => alert('Error de conexión con el servidor.'));
        }

        function logout() {
            document.getElementById('app-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
            currentUserRole = '';
            limpiarBusqueda();
        }

        function cargarInventario() {
            fetch(`${API_URL}?action=read`)
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        inventarioData = res.data;
                        construirFormularioDinamico();
                        aplicarFiltroYPagina();
                    }
                });
        }

        function construirFormularioDinamico() {
            const container = document.getElementById('formFieldsContainer');
            container.innerHTML = '';
            if (inventarioData.length === 0) return;

            const headers = inventarioData[0];
            headers.forEach((header, index) => {
                let colDiv = document.createElement('div');
                colDiv.className = 'col-md-4';
                colDiv.innerHTML = `
                    <label class="form-label text-capitalize">${header}</label>
                    <input type="text" id="field_${index}" class="form-control">
                `;
                container.appendChild(colDiv);
            });
        }

        function cambiarFiltro() {
            paginaActual = 1;
            aplicarFiltroYPagina();
        }

        function limpiarBusqueda() {
            document.getElementById('searchInput').value = '';
            paginaActual = 1;
            aplicarFiltroYPagina();
        }

        function cambiarRegistrosPorPagina() {
            registrosPorPagina = parseInt(document.getElementById('itemsPerPage').value);
            paginaActual = 1;
            aplicarFiltroYPagina();
        }

        function aplicarFiltroYPagina() {
            const filtro = document.getElementById('searchInput').value.toLowerCase().trim();
            filasFiltradasIndices = [];

            if (inventarioData.length > 1) {
                for (let i = 1; i < inventarioData.length; i++) {
                    const row = inventarioData[i];
                    const coincide = filtro === '' || row.some(cell => 
                        String(cell !== undefined ? cell : '').toLowerCase().includes(filtro)
                    );
                    if (coincide) {
                        filasFiltradasIndices.push(i);
                    }
                }
            }
            renderTable();
        }

        function renderTable() {
            const thead = document.querySelector('#inventarioTable thead');
            const tbody = document.querySelector('#inventarioTable tbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (inventarioData.length === 0) return;

            let headerRow = '<tr>';
            inventarioData[0].forEach(col => {
                headerRow += `<th>${col}</th>`;
            });
            headerRow += '<th class="text-center">Acciones</th></tr>';
            thead.innerHTML = headerRow;

            const totalFiltrados = filasFiltradasIndices.length;
            const totalPaginas = Math.ceil(totalFiltrados / registrosPorPagina) || 1;
            if (paginaActual > totalPaginas) paginaActual = totalPaginas;

            const inicio = (paginaActual - 1) * registrosPorPagina;
            const fin = inicio + registrosPorPagina;
            const indicesPagina = filasFiltradasIndices.slice(inicio, fin);

            indicesPagina.forEach(i => {
                let row = inventarioData[i];
                let tr = '<tr>';
                row.forEach(cell => {
                    tr += `<td>${cell !== undefined ? cell : ''}</td>`;
                });
                
                let btnEliminarHTML = (currentUserRole.toLowerCase() === 'administrador') 
                    ? `<button class="btn btn-sm btn-danger" onclick="eliminarFila(${i + 1})">Eliminar</button>` 
                    : '';

                tr += `<td class="text-center">
                        <button class="btn btn-sm btn-warning me-1" onclick="editarFila(${i})">Editar</button>
                        ${btnEliminarHTML}
                       </td>`;
                tr += '</tr>';
                tbody.innerHTML += tr;
            });

            const contadorEl = document.getElementById('contadorRegistros');
            contadorEl.innerText = `Mostrando ${totalFiltrados > 0 ? inicio + 1 : 0} al ${Math.min(fin, totalFiltrados)} de ${totalFiltrados} registros filtrados (Total: ${inventarioData.length - 1})`;
            
            renderPaginacion(totalPaginas);
        }

        function renderPaginacion(totalPaginas) {
            const paginationEl = document.getElementById('paginationContainer');
            paginationEl.innerHTML = '';

            if (totalPaginas <= 1) return;

            paginationEl.innerHTML += `
                <li class="page-item ${paginaActual === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="cambiarPagina(${paginaActual - 1})">Anterior</a>
                </li>
            `;

            for (let p = 1; p <= totalPaginas; p++) {
                if (p === 1 || p === totalPaginas || (p >= paginaActual - 1 && p <= paginaActual + 1)) {
                    paginationEl.innerHTML += `
                        <li class="page-item ${p === paginaActual ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="cambiarPagina(${p})">${p}</a>
                        </li>
                    `;
                }
            }

            paginationEl.innerHTML += `
                <li class="page-item ${paginaActual === totalPaginas ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="cambiarPagina(${paginaActual + 1})">Siguiente</a>
                </li>
            `;
        }

        function cambiarPagina(p) {
            if (p < 1) return;
            paginaActual = p;
            renderTable();
        }

        function exportarAExcel() {
            if (inventarioData.length === 0) {
                alert('No hay datos para exportar.');
                return;
            }

            let csvContent = "\uFEFF"; // BOM para correcta codificación de tildes y eñes en Excel
            
            // Incluir cabeceras
            csvContent += inventarioData[0].join(";") + "\n";

            // Incluir solo las filas que coincidan con el filtro de búsqueda actual
            filasFiltradasIndices.forEach(i => {
                let row = inventarioData[i].map(cell => {
                    let val = cell !== undefined ? String(cell) : '';
                    // Escapar comillas dobles y puntos y comas
                    return '"' + val.replace(/"/g, '""') + '"';
                });
                csvContent += row.join(";") + "\n";
            });

            // Crear archivo descargable
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `inventario_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function saveItem(e) {
            e.preventDefault();
            const rowIndex = document.getElementById('rowIndex').value;
            const headers = inventarioData[0];
            let rowData = [];

            for (let i = 0; i < headers.length; i++) {
                rowData.push(document.getElementById(`field_${i}`).value);
            }

            const action = rowIndex ? 'update' : 'add';
            const realRowIndex = rowIndex ? parseInt(rowIndex) + 1 : null;

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: action, row: rowData, rowIndex: realRowIndex, role: currentUserRole })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    resetForm();
                    cargarInventario();
                } else {
                    alert('Error: ' + res.message);
                }
            });
        }

        function editarFila(index) {
            const row = inventarioData[index];
            document.getElementById('rowIndex').value = index;
            
            const headers = inventarioData[0];
            headers.forEach((h, i) => {
                const field = document.getElementById(`field_${i}`);
                if (field) field.value = row[i] !== undefined ? row[i] : '';
            });

            document.getElementById('formTitle').innerText = 'Editar Registro de Inventario';
            document.getElementById('btnGuardar').innerText = 'Actualizar';
            document.getElementById('btnCancelar').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function eliminarFila(sheetRowIndex) {
            if (confirm('¿Estás seguro de eliminar este registro del inventario?')) {
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', rowIndex: sheetRowIndex, role: currentUserRole })
                })
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        cargarInventario();
                    } else {
                        alert('Error: ' + res.message);
                    }
                });
            }
        }

        function resetForm() {
            document.getElementById('itemForm').reset();
            document.getElementById('rowIndex').value = '';
            document.getElementById('formTitle').innerText = 'Agregar Nuevo Registro';
            document.getElementById('btnGuardar').innerText = 'Guardar Registro';
            document.getElementById('btnCancelar').style.display = 'none';
        }
    </script>
</body>
</html>
