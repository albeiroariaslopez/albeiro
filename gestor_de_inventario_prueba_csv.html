<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de Datos - Prueba Google Drive</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Registro de Datos</h2>
    
    <form id="dataForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nombre completo</label>
        <input type="text" id="nombre" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
        <input type="email" id="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Observaciones</label>
        <textarea id="observaciones" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500"></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-200">
        Guardar en Google Drive
      </button>
    </form>

    <div id="statusMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
  </div>

  <script>
    // REEMPLAZA ESTA URL CON LA QUE TE DIO GOOGLE APPS SCRIPT AL PUBLICAR
    const WEB_APP_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID_AQUI/exec";

    document.getElementById('dataForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSubmit');
      const status = document.getElementById('statusMessage');

      btn.disabled = true;
      btn.textContent = 'Enviando...';
      status.classList.add('hidden');

      const payload = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        observaciones: document.getElementById('observaciones').value
      };

      try {
        // Enviar datos mediante fetch (text/plain evita bloqueos de CORS en Apps Script)
        await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });

        status.textContent = "¡Datos guardados correctamente en Google Drive!";
        status.className = "mt-4 text-center text-sm font-medium text-green-600";
        status.classList.remove('hidden');
        document.getElementById('dataForm').reset();

      } catch (error) {
        status.textContent = "Error al guardar los datos.";
        status.className = "mt-4 text-center text-sm font-medium text-red-600";
        status.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar en Google Drive';
      }
    });
  </script>
</body>
</html>
